<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart AI Chatbot</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="chat-container">


        <!-- Header -->

        <div class="chat-header">

            <h2>🤖 Smart Chatbot</h2>

            <p>Created by Muhammad Awais</p>

            <button id="theme-btn">
            🌙
        </button>

        </div>



        <!-- Chat Messages -->

        <div id="chat-box">

            <div class="bot-message">

                Hello 👋 I am Smart Offline Chatbot. Ask me anything about programming, AI, technology or portfolio.

            </div>


        </div>



        <!-- Input Area -->

        <div class="input-area">

            <input type="text" id="user-input" placeholder="Type your message...">

            <button id="voice-btn">
        🎤
    </button>

            <button id="send-btn">
        Send
    </button>

            <button onclick="clearChat()">
        🗑️
    </button>

        </div>
        🗑️
        <script src="script.js"></script>


</body>

</html>
